# Конфигурация Ansible для деплоя FlashHunter.
[defaults]
inventory = inventory.ini
roles_path = roles
host_key_checking = True          # не отключаем: MITM на деплое = украденные ключи
retry_files_enabled = False
stdout_callback = yaml
interpreter_python = auto_silent
forks = 5
# Секреты (ключи кошельков, RPC) хранятся в vault: ansible-vault encrypt group_vars/all/vault.yml
vault_password_file = .vault_pass

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False
