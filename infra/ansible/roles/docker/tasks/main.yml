---
# Роль docker: установка Docker Engine и Compose v2 из официального репозитория.
# Версия дистрибутивного docker обычно старая; нам нужны свежие Compose-фичи
# (профили, depends_on.condition) и предсказуемое поведение healthcheck.

- name: Установка зависимостей для репозитория Docker
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg, python3-debian]
    state: present
  tags: [docker]

- name: Добавление GPG-ключа Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
  tags: [docker]

- name: Подключение репозитория Docker
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    state: present
    filename: docker
  tags: [docker]

- name: Установка Docker Engine, CLI и Compose v2
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true
  tags: [docker]

- name: Конфигурация демона (лог-ротация, без live-restore для бота)
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: "{{ docker_daemon_config | to_nice_json(indent=2) }}"
    mode: "0644"
  notify: Перезапуск docker
  tags: [docker]

- name: Добавление пользователя бота в группу docker
  ansible.builtin.user:
    name: "{{ flashhunter_user }}"
    groups: docker
    append: true
  tags: [docker]

- name: Включение и запуск Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  tags: [docker]

- name: Проверка работы Docker
  ansible.builtin.command: docker version --format '{{ "{{" }}.Server.Version{{ "}}" }}'
  register: docker_version
  changed_when: false
  tags: [docker, verify]

- name: Версия Docker в отчёте
  ansible.builtin.debug:
    msg: "Docker Engine: {{ docker_version.stdout }}"
  tags: [docker, verify]

- name: Ротация логов Docker в journald (чтобы диск не забивался)
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/flashhunter.conf
    content: |
      [Journal]
      SystemMaxUse=2G
      SystemMaxFileSize=200M
      MaxRetentionSec=14day
    mode: "0644"
  notify: Перезапуск journald
  tags: [docker]
