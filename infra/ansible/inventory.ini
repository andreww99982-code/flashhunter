# Инвентори продакшна. Адреса берутся из terraform output либо из VPN-DNS.
# Доступ только по SSH-ключу, пароли отключены (см. роль common).
[hotpath]
fh-prod-1 ansible_host=10.42.0.10 ansible_user=ubuntu instance_role=primary

[hotpath:vars]
ansible_ssh_common_args='-o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o ServerAliveInterval=30'

[all:vars]
# Путь развёртывания и владелец процесса
flashhunter_dir=/opt/flashhunter
flashhunter_user=ubuntu
# Версия образов (переопределяется в CD-пайплайне: -e flashhunter_version=0.1.7)
flashhunter_version=0.1.0
# Профили docker compose: prod-хранилища + наблюдаемость
compose_profiles=cluster,observability
