# Секреты кластера. ВНИМАНИЕ: это шаблон — реальные значения приходят из
# External Secrets / Sealed Secrets / Vault. Не коммитьте сюда настоящие ключи!
#   kubectl create secret generic flashhunter-secrets -n flashhunter \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=ETH_RPC_HTTP="$ETH_RPC_HTTP" ...
apiVersion: v1
kind: Secret
metadata:
  name: flashhunter-secrets
  namespace: flashhunter
type: Opaque
stringData:
  # JWT для панели: сгенерируйте случайные 32+ байта
  JWT_SECRET: "REPLACE_ME_WITH_RANDOM_32_BYTES"
  # Учётные данные хранилищ
  POSTGRES_DSN: "postgresql+asyncpg://flashhunter:REPLACE_ME@postgres.flashhunter.svc.cluster.local:5432/flashhunter"
  CLICKHOUSE_PASSWORD: "REPLACE_ME"
  # Админ панели: пароль меняется при первом входе (FLASHHUNTER_FORCE_PASSWORD_CHANGE)
  ADMIN_DEFAULT_USER: "admin"
  ADMIN_DEFAULT_PASSWORD: "REPLACE_ME"
  # RPC-провайдеры (по одному на сеть; приватные ключи кошельков СЮДА НЕ ПОПАДАЮТ —
  # они живут в KMS/HSM, см. docs/adr/0006-keys-in-kms.md)
  ETH_RPC_HTTP: "https://REPLACE_ME"
  ARB_RPC_HTTP: "https://REPLACE_ME"
  BASE_RPC_HTTP: "https://REPLACE_ME"
  # Авторизация релеев
  FLASHBOTS_AUTH_KEY: "REPLACE_ME"
  BLOXROUTE_AUTH_HEADER: "REPLACE_ME"
  # Уведомления оператора
  ALERT_TELEGRAM_TOKEN: ""
  ALERT_TELEGRAM_CHAT_ID: ""
  ALERT_DISCORD_WEBHOOK: ""
---
# Отдельный секрет для образов из приватного registry (если репозиторий приватный)
apiVersion: v1
kind: Secret
metadata:
  name: flashhunter-registry
  namespace: flashhunter
type: kubernetes.io/dockerconfigjson
stringData:
  # Заполняется в CI: kubectl create secret docker-registry ...
  .dockerconfigjson: '{"auths":{}}'
