# Автомасштабирование API по CPU и по RPS (через внешние метрики Prometheus).
# Важно: масштабировать «горячий путь» выше 4 реплик смысла нет — лидер один,
# поэтому критично, чтобы реплики не боролись за один и тот же bundle.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flashhunter-api
  namespace: flashhunter
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: flashhunter-api
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
    - type: Resource
      resource:
        name: memory
        target: { type: Utilization, averageUtilization: 80 }
  behavior:
    scaleDown:
      # Медленное снижение: резкое сокращение реплик = потерянное окно блока
      stabilizationWindowSeconds: 600
      policies:
        - { type: Pods, value: 1, periodSeconds: 300 }
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - { type: Pods, value: 1, periodSeconds: 60 }
