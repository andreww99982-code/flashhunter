# Несекретная конфигурация. Секреты (RPC-ключи, JWT, пароли) — только в Secret (02).
apiVersion: v1
kind: ConfigMap
metadata:
  name: flashhunter-config
  namespace: flashhunter
data:
  FLASHHUNTER_ENV: "prod"
  FLASHHUNTER_LOG_LEVEL: "INFO"
  FLASHHUNTER_LOG_JSON: "true"
  FLASHHUNTER_DB_MODE: "postgres"
  FLASHHUNTER_AUTO_OPEN_BROWSER: "false"
  MOCK_MARKET_DATA: "false"
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  # В кластере Redis/NATS — внутренние сервисы, адреса разрешаются через DNS
  REDIS_URL: "redis://flashhunter-redis.flashhunter.svc.cluster.local:6379/0"
  NATS_URL: "nats://flashhunter-nats.flashhunter.svc.cluster.local:4222"
  CLICKHOUSE_DSN: "clickhouse://clickhouse.flashhunter.svc.cluster.local:8123/flashhunter"
  # Регламент риска: лимиты жёстче локальных — в кластере крутятся реальные деньги
  RISK_DAILY_LOSS_LIMIT_USD: "500"
  RISK_HOURLY_LOSS_LIMIT_USD: "150"
  EXEC_MIN_PROFIT_USD: "5"
  EXEC_MAX_GAS_GWEI: "120"
  # Релеи: адреса публичные, авторизация — в Secret
  FLASHBOTS_RELAY_URL: "https://relay.flashbots.net"
  BLOXROUTE_RELAY_URL: "https://mev.api.blxrbdn.com"
  TITAN_RELAY_URL: "https://rpc.titanbuilder.xyz"
  RELAY_TIMEOUT_MS: "250"
