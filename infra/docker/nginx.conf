# FlashHunter: опциональный реверс-прокси для продакшна (profile "edge" в compose).
# Зачем: TLS-терминация, gzip, rate-limit на /login и проксирование WebSocket-канала.
# В локальном режиме не нужен — FastAPI отдаёт и API, и SPA сам.

worker_processes auto;
events { worker_connections 4096; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    # Сжатие: панель отдаёт ~1.5 МБ JS без gzip — включаем обязательно
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/wasm;
    gzip_min_length 1024;

    # Защита от перебора пароля: 10 попыток в минуту с одного IP
    limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;

    upstream flashhunter_api {
        server api:8000;
        keepalive 64;
    }

    server {
        listen 80;
        server_name _;

        # WebSocket-канал телеметрии (панель автообновляется без перезагрузки)
        location /ws {
            proxy_pass http://flashhunter_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        # Ограничение частоты на аутентификацию
        location /api/v1/auth/ {
            limit_req zone=login_zone burst=5 nodelay;
            proxy_pass http://flashhunter_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Всё остальное: API + SPA
        location / {
            proxy_pass http://flashhunter_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
    }
}
