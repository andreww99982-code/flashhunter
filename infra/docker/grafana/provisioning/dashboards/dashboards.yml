# FlashHunter: автозагрузка дашбордов из файлов при старте Grafana (provisioning).
apiVersion: 1
providers:
  - name: flashhunter
    orgId: 1
    folder: FlashHunter
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
